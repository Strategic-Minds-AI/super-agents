[deploy]
startCommand = "node mcp-server.js"
restartPolicyType = "ON_FAILURE"
maxRestartPerPeriod = 3

# Required in Railway: MCP_BEARER_TOKEN. The server exposes /healthz,
# /mcp, and /v1/execute. Execution stays disabled until the isolated
# sandbox adapter is explicitly enabled with EDEN_F2_EXECUTOR_ENABLED=true.
